  # ----------------------------------------------------------
  # Stage 3 — Build (teuerster Step, NACH den Tests; ADR D2)
  # ----------------------------------------------------------
  build:
    name: build
    needs: [unit-tests, integration-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Configure git token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$GH_TOKEN" | tr -d '\n\r')
          git config --global url."https://x-access-token:${CLEAN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'lib/**', 'components/**', 'packages/**/src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build packages + app (Reihenfolge lt. ADR D4)
        # TODO(p1.5-handoff): auf `pnpm run build:packages && pnpm run build`
        # umstellen, sobald build:packages als Script zentralisiert ist.
        run: |
          pnpm --filter @n3ural/office-core build
          pnpm --filter @n3ural/office-agent-runtime build
          pnpm --filter @n3ural/office-cli build
          pnpm --filter @n3ural/office-mcp build
          NODE_OPTIONS='--max-old-space-size=4096' pnpm run build

  # ----------------------------------------------------------
  # Stage 4 — E2E-Smoke (Playwright Login-Smoke; ADR D1/D2)
  # Einhängepunkt Task 2.3 — Job lebt HIER, nicht in e2e-smoke.yml
  # ----------------------------------------------------------
  e2e-smoke:
    name: e2e-smoke
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: n3ural_ci
          POSTGRES_USER: crm_admin
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Configure git token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CLEAN_TOKEN=$(printf '%s' "$GH_TOKEN" | tr -d '\n\r')
          git config --global url."https://x-access-token:${CLEAN_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup test database
        id: db
        uses: ./.github/actions/setup-test-db
        with:
          postgres-password: ci_test_password_only

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run login smoke
        # webServer-Block in playwright.config.ts startet den Dev-Server selbst.
        env:
          DATABASE_URL: ${{ steps.db.outputs.database-url }}
          CI: "true"
          E2E_SMOKE_EMAIL: ci-owner@example.test
          E2E_SMOKE_PASSWORD: ci-owner-smoke-pw
          # Dummy-Secret NUR für den ephemeren CI-Dev-Server (Auth.js MissingSecret-Fix).
          # Kein echtes Secret nötig: Wegwerf-DB, synthetischer User, kein externer Zugriff.
          AUTH_SECRET: ci-e2e-dummy-auth-secret-not-production
          AUTH_TRUST_HOST: "true"
          MULTI_TENANT_ENABLED: "true"
        run: pnpm exec playwright test tests/e2e/login-smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
